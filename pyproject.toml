[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-scripts-collection"
version = "0.1.0"
description = "Assorted data generators and file utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lyu" }]

dependencies = [
  "faker>=18.0",
]

[project.optional-dependencies]
image = [
  "numpy>=1.23",
  "opencv-python>=4.7",
  "Pillow>=9.0",
]
docx = [
  "python-docx>=0.8.11",
]
pcap = [
  "scapy>=2.4",
]
crypto = [
  "cryptography>=41.0",
]
ocr = [
  "pytesseract>=0.3.10",
]
all = [
  "numpy>=1.23",
  "opencv-python>=4.7",
  "Pillow>=9.0",
  "python-docx>=0.8.11",
  "scapy>=2.4",
  "cryptography>=41.0",
  "pytesseract>=0.3.10",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["DataGenerator*", "FileGenerator*", "FileHanding*", "Services*"]
